name: download
description: >
  Download one file of a registered dataset from the first working host
  (HTTP(S), file:// or API handlers), verify it and record its provenance.
url: https://www.modelblocks.org/
authors:
  - Modelblocks contributors
input:
  - handlers: the handler modules of the `kind: api` hosts.
  - Optional. Any files needed by API handlers (e.g., cached extensions).
output:
  - path: the downloaded file.
  - provenance: a YAML file recording the dataset, version, host, URL, retrieval time, checksum, size, license, tags and note.
log:
  - Log file of the download job.
params:
  - dataset: name of the dataset.
  - >
    spec: the resolved dataset version, i.e. `license`, file name `files` templates,
    `sha256` checksums (keyed by file name), `tags` and `note`.
wildcards:
  - version: dataset version.
  - file: file name. Must match one of the `spec.files` templates; their placeholders are passed to hosts.
config:
  - >
    `_downloads.hosts.<dataset>.<version>`: list of resolved hosts to try, in order.
    Each host has a `name`, `kind`, `url` template, `priority` and `extras`, plus a `handler` (path of the handler module, also given in `input.handlers`) for `kind: api` hosts.
  - "`_downloads.settings`: `user_agent` and `timeouts` (`max_retries`, `connect_seconds`, `read_seconds`, `initial_retry_seconds`)."
notes: |
  * The wrapper does not merge, validate or select anything: the calling workflow resolves
    its registry (following `downloads.schema.yaml`) into `params.spec` and `_downloads` beforehand.
    The hosts of a version are the dataset hosts plus the version hosts, without `null` hosts,
    sorted by `priority` (lower values first).
  * `kind: file` hosts are fetched over HTTP(S) (resuming partial downloads) or copied from file:// URLs.
  * `kind: api` hosts are fetched by the `fetch(request) -> dict` function of their handler module.
    The request has `host` (incl. `extras`), `url`, `version`, `placeholders`, `destination`, `session`, `timeouts`,
    a `get(url, **kwargs)` method for retrying GET requests
    and a `secret(extra)` method that reads the environment variable named by a host extra.
    `fetch` writes the file to `request.destination` and returns extra provenance entries.
  * Hosts are tried in order, regardless of their kind, until one provides a non-empty file
    matching the version's `sha256` checksum (if listed for the file).
  * Host `extras` never hold secrets (e.g., API keys): they hold the name of the environment variable to read with `secret`.
  * Hosts are read from `snakemake.config` rather than params, so that changing hosts does not trigger reruns.
    Changes to `input.handlers` (the handler modules) do trigger reruns.
    Changes to `params.spec` (e.g., a new checksum) do trigger reruns.
